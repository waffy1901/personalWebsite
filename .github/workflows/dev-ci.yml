name: Main PR CI

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies
        working-directory: main
        run: npm ci

      - name: Set up Python for migration checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test bundle budget checker
        run: npm run test:bundle-budgets

      - name: Build
        working-directory: main
        env:
          VITE_GA_MEASUREMENT_ID: ''
          VITE_FORMSPREE_KEY: synthetic-premerge-test-key
        run: npm run build

      - name: Check JavaScript and CSS byte budgets
        run: npm run check:bundle-budgets

  premerge-browser-smoke:
    name: Pre-merge browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies
        working-directory: main
        run: npm ci

      - name: Install Chromium
        working-directory: main
        run: npx playwright install --with-deps chromium

      - name: Run local pre-merge browser and accessibility tests
        run: npm run test:e2e:premerge

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: premerge-browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            main/playwright-report/
            main/test-results/
          if-no-files-found: warn
          retention-days: 7
