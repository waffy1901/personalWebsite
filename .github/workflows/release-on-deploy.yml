name: Create deployment release

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies
        working-directory: main
        run: npm ci

      - name: Lint
        working-directory: main
        run: npm run lint

      - name: Test
        working-directory: main
        run: npm test

      - name: Test Netlify deploy-state classifier
        run: python3 scripts/test_netlify_deploy_state.py

      - name: Test Netlify publication identity and workflow
        run: |
          python3 scripts/test_netlify_published_deploy.py
          python3 scripts/test_release_on_deploy_workflow.py

      - name: Build
        working-directory: main
        run: npm run build

  resolve_deploy:
    name: Resolve Netlify production deploy
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 40
    outputs:
      deployed: ${{ steps.resolve.outputs.deployed }}
      deploy_url: ${{ steps.resolve.outputs.deploy_url }}
      deploy_id: ${{ steps.resolve.outputs.deploy_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Netlify production deploy
        id: resolve
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${NETLIFY_AUTH_TOKEN}" ] || [ -z "${NETLIFY_SITE_ID}" ]; then
            echo "NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID secrets are required before creating deployment releases."
            exit 1
          fi

          selected_id=""
          for attempt in $(seq 1 45); do
            if [ -n "$selected_id" ]; then
              lookup_url="https://api.netlify.com/api/v1/deploys/${selected_id}"
            else
              lookup_url="https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/deploys?production=true&per_page=100"
            fi
            deploy_json="$(curl -fsS --connect-timeout 5 --max-time 15 \
              -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" "$lookup_url")"
            if ! classification="$(printf '%s' "$deploy_json" | python3 scripts/check_netlify_deploy_state.py \
              --expected-commit "$EXPECTED_COMMIT" --expected-site "$NETLIFY_SITE_ID" --selected-deploy-id "$selected_id")"; then
              echo "::error::Could not classify the target Netlify production deploy."
              exit 1
            fi

            decision="$(printf '%s' "$classification" | python3 -c 'import json, sys; print(json.load(sys.stdin)["decision"])')"
            selected_id="$(printf '%s' "$classification" | python3 -c 'import json, sys; print(json.load(sys.stdin)["deploy_id"])')"

            case "$decision" in
              ready)
                site_json="$(curl -fsS --connect-timeout 5 --max-time 15 \
                  -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
                  "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}")"
                if ! publication="$(printf '%s' "$site_json" | python3 scripts/check_netlify_published_deploy.py \
                  --expected-commit "$EXPECTED_COMMIT" --expected-site "$NETLIFY_SITE_ID" --expected-deploy "$selected_id")"; then
                  echo "::error::Could not validate the Netlify published deployment."
                  exit 1
                fi
                published="$(printf '%s' "$publication" | python3 -c 'import json, sys; print(json.load(sys.stdin)["decision"])')"
                if [ "$published" = "published" ]; then
                  deploy_url="$(printf '%s' "$publication" | python3 -c 'import json, sys; print(json.load(sys.stdin)["deploy_url"])')"
                  echo "Netlify publishes ${selected_id} for ${EXPECTED_COMMIT}: ${deploy_url}"
                  {
                    echo "deployed=true"
                    echo "deploy_url=${deploy_url}"
                    echo "deploy_id=${selected_id}"
                  } >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                ;;
              skipped)
                echo "Netlify skipped the production deploy for ${EXPECTED_COMMIT}; no deployment release will be created."
                {
                  echo "deployed=false"
                  echo "deploy_url="
                  echo "deploy_id="
                } >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              failed)
                echo "::error::Netlify production deploy ${EXPECTED_COMMIT} failed."
                exit 1
                ;;
              wait) ;;
              *)
                echo "::error::Deploy-state classifier returned an unexpected decision."
                exit 1
                ;;
            esac

            if [ "$attempt" = "45" ]; then
              echo "::error::Timed out waiting for Netlify to publish target deployment ${EXPECTED_COMMIT} (${selected_id})."
              exit 1
            fi
            echo "Waiting for Netlify publication of ${EXPECTED_COMMIT}; attempt ${attempt}/45."
            sleep 20
          done

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: resolve_deploy
    if: needs.resolve_deploy.outputs.deployed == 'true'
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      - name: Test deployed route checker
        run: python3 scripts/test_deployed_routes.py

      - name: Test deployed header checker
        run: python3 scripts/test_deployed_security_headers.py

      - name: Test deployed artifact checker
        run: python3 scripts/test_deployed_artifacts.py

      - name: Verify CSP JSON-LD hash
        run: node .codex/skills/csp-security-header-maintainer/scripts/check_csp_jsonld_hash.mjs "$GITHUB_WORKSPACE"

      - name: Validate immutable deployment
        env:
          SITE_URL: ${{ needs.resolve_deploy.outputs.deploy_url }}
        run: |
          python3 scripts/check-deployed-routes.py --repo "$GITHUB_WORKSPACE" --site-url "$SITE_URL"
          python3 scripts/check-deployed-security-headers.py --repo "$GITHUB_WORKSPACE" --site-url "$SITE_URL"
          python3 scripts/check-deployed-artifacts.py --repo "$GITHUB_WORKSPACE" --site-url "$SITE_URL"

      - name: Validate deployed routes
        env:
          SITE_URL: https://waffy.dev
        run: python3 scripts/check-deployed-routes.py --repo "$GITHUB_WORKSPACE" --site-url "$SITE_URL"

      - name: Validate deployed security headers
        env:
          SITE_URL: https://waffy.dev/
        run: python3 scripts/check-deployed-security-headers.py --repo "$GITHUB_WORKSPACE" --site-url "$SITE_URL"

      - name: Validate deployed artifacts
        env:
          SITE_URL: https://waffy.dev/
        run: python3 scripts/check-deployed-artifacts.py --repo "$GITHUB_WORKSPACE" --site-url "$SITE_URL"

      - name: Validate legacy Netlify domain redirect
        env:
          LEGACY_RESUME_URL: https://waffy.netlify.app/waffyAhmedResume.pdf
        run: |
          set -euo pipefail
          legacy_headers="$(curl -fsSI "$LEGACY_RESUME_URL")"
          printf '%s\n' "$legacy_headers" | grep -Eiq '^HTTP/[0-9.]+ 301'
          printf '%s\n' "$legacy_headers" | tr -d '\r' | grep -Fiq 'Location: https://waffy.dev/waffyAhmedResume.pdf'

      - name: Recheck published deployment before release
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_DEPLOY_ID: ${{ needs.resolve_deploy.outputs.deploy_id }}
          NETLIFY_DEPLOY_URL: ${{ needs.resolve_deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          site_json="$(curl -fsS --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}")"
          printf '%s' "$site_json" | python3 scripts/check_netlify_published_deploy.py \
            --expected-commit "$EXPECTED_COMMIT" --expected-site "$NETLIFY_SITE_ID" \
            --expected-deploy "$NETLIFY_DEPLOY_ID" --expected-url "$NETLIFY_DEPLOY_URL" --require-published

      - name: Create GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NETLIFY_DEPLOY_URL: ${{ needs.resolve_deploy.outputs.deploy_url }}
          NETLIFY_DEPLOY_ID: ${{ needs.resolve_deploy.outputs.deploy_id }}
        with:
          script: |
            const shortSha = context.sha.slice(0, 7);
            const timestamp = new Date()
              .toISOString()
              .replace(/[-:]/g, "")
              .replace(/\.\d{3}Z$/, "Z");
            const tagName = `deploy-${timestamp}-${shortSha}`;
            const releaseName = `Deployment ${timestamp} (${shortSha})`;

            const body = [
              `Automated release for deployment commit ${context.sha}.`,
              "",
              `- Branch: ${context.ref.replace("refs/heads/", "")}`,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "- Site: https://waffy.dev",
              `- Netlify deploy: ${process.env.NETLIFY_DEPLOY_URL}`,
              `- Netlify deploy ID: ${process.env.NETLIFY_DEPLOY_ID}`,
            ].join("\n");

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              target_commitish: context.sha,
              name: releaseName,
              body,
              draft: false,
              prerelease: false,
              make_latest: 'false',
              generate_release_notes: true,
            });

  production-browser-smoke:
    name: Advisory production browser smoke
    runs-on: ubuntu-latest
    needs: release
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies
        working-directory: main
        run: npm ci

      - name: Install Chromium
        working-directory: main
        run: npx playwright install --with-deps chromium

      - name: Run telemetry-safe production smoke tests
        env:
          PLAYWRIGHT_PRODUCTION_BASE_URL: https://waffy.dev
        run: npm run test:e2e:production

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-browser-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            main/playwright-report/
            main/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize advisory browser result
        if: always()
        env:
          BROWSER_JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$BROWSER_JOB_STATUS" = "success" ]; then
            echo "### Advisory production browser smoke: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Advisory production browser smoke: warning" >> "$GITHUB_STEP_SUMMARY"
            echo "The release was already created. Review the uploaded Playwright evidence before promoting this lane to a release blocker." >> "$GITHUB_STEP_SUMMARY"
          fi
