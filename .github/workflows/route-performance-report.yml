name: Route performance report

"on":
  schedule:
    - cron: "17 7 * * 3"
  workflow_dispatch:
    inputs:
      scenario:
        description: Measurement scenario (configured contact is a bounded browser diagnostic)
        type: choice
        options:
          - fallback
          - configured-contact
        default: fallback
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: route-performance-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Measure canonical routes
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies
        working-directory: main
        run: npm ci

      - name: Acquire bounded compatible-baseline candidates
        if: inputs.scenario != 'configured-contact'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node main/scripts/acquire-route-performance-baselines.mjs
          --output-dir "$RUNNER_TEMP/route-performance-baselines"

      - name: Build once and measure every canonical route
        if: inputs.scenario != 'configured-contact'
        env:
          CHROME_PATH: /usr/bin/google-chrome
          VITE_GA_MEASUREMENT_ID: ""
          VITE_FORMSPREE_KEY: ""
        run: >-
          npm run performance:report --
          --build
          --serve
          --baseline-candidates "$RUNNER_TEMP/route-performance-baselines/candidates.json"
          --output-dir main/performance-results/route-performance-v1/current

      - name: Measure configured contact browser diagnostic
        if: inputs.scenario == 'configured-contact'
        env:
          CHROME_PATH: /usr/bin/google-chrome
          VITE_GA_MEASUREMENT_ID: ""
          VITE_FORMSPREE_KEY: synthetic-webkit-smoke-key
        run: >-
          npm run performance:report --
          --scenario configured-contact
          --build
          --serve
          --output-dir main/performance-results/route-performance-v1/current

      - name: Publish report in the Actions summary
        if: always()
        run: |
          if [ -f main/performance-results/route-performance-v1/current/report.md ]; then
            cat main/performance-results/route-performance-v1/current/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Route performance setup failed before a report checkpoint was written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain measurement evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.scenario == 'configured-contact' && 'configured-contact-v1' || 'route-performance-v1' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: main/performance-results/route-performance-v1/current
          if-no-files-found: warn
          retention-days: 21
