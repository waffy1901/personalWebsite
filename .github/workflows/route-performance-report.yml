name: Route performance report

"on":
  schedule:
    - cron: "17 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: route-performance-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    name: Measure canonical routes
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies
        working-directory: main
        run: npm ci

      - name: Acquire bounded compatible-baseline candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node main/scripts/acquire-route-performance-baselines.mjs
          --output-dir "$RUNNER_TEMP/route-performance-baselines"

      - name: Build once and measure every canonical route
        env:
          CHROME_PATH: /usr/bin/google-chrome
          VITE_GA_MEASUREMENT_ID: ""
          VITE_FORMSPREE_KEY: ""
        run: >-
          npm run performance:report --
          --build
          --serve
          --baseline-candidates "$RUNNER_TEMP/route-performance-baselines/candidates.json"
          --output-dir main/performance-results/route-performance-v1/current

      - name: Publish report in the Actions summary
        if: always()
        run: |
          if [ -f main/performance-results/route-performance-v1/current/report.md ]; then
            cat main/performance-results/route-performance-v1/current/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Route performance setup failed before a report checkpoint was written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain measurement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: route-performance-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: main/performance-results/route-performance-v1/current
          if-no-files-found: warn
          retention-days: 21
