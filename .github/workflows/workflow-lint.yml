name: Lint GitHub Actions workflows

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Register actionlint problem matcher
        run: echo "::add-matcher::.github/actionlint-matcher.json"

      - name: Check workflow files
        run: bash scripts/check-workflows.sh

      - name: Set up Node for deployment release fixtures
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      - name: Test automatic deployment release guards
        run: |
          python3 scripts/test_netlify_deploy_state.py
          python3 .codex/skills/portfolio-deployment-verifier/scripts/test_deployment_evidence.py
          python3 scripts/test_netlify_published_deploy.py
          python3 scripts/test_release_on_deploy_workflow.py
