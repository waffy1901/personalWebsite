name: WebKit smoke

"on":
  schedule:
    - cron: "37 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webkit-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Exercise local preview in WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install dependencies
        working-directory: main
        run: npm ci

      - name: Install matching WebKit runtime and system dependencies
        working-directory: main
        run: npx playwright install --with-deps webkit

      - name: Build and exercise the local production preview
        run: npm run test:e2e:webkit

      - name: Publish WebKit report in the Actions summary
        if: always()
        run: |
          if [ -f main/webkit-results/current/report.md ]; then
            cat main/webkit-results/current/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WebKit setup failed before a report checkpoint was written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain WebKit runtime and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webkit-smoke-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: main/webkit-results/current
          if-no-files-found: warn
          retention-days: 14
